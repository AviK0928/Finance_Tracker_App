# Local Postgres for development. Start with:  docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: Finance_Tracker
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d Finance_Tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
