# CI: backend tests against a real Postgres, Android unit tests and a debug build.
# Mirrors the Codespace setup (.devcontainer/post-create.sh and docker-compose.yml).
name: CI

# Runs once per change on main. Feature branches are not built on push (our flow pushes the
# same commit to the branch and to main, which ran CI twice); to check a branch before merging,
# use "Run workflow" in the Actions tab and pick the branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run for the same ref cancels the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same image and database name as docker-compose.yml; the tests run Flyway against it
      db:
        image: postgres:16
        env:
          POSTGRES_DB: Finance_Tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d Finance_Tracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/Finance_Tracker
      DB_USERNAME: postgres
      DB_PASSWORD: localdev
    defaults:
      run:
        working-directory: Finance_tracker_Backend/Finance_Tracker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # A throwaway signing key per run, like the one post-create.sh writes into .env.
      # FIREBASE_SERVICE_ACCOUNT_JSON stays unset: the backend then uses the no-op push sender.
      - name: Generate JWT secret
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Run tests
        run: ./mvnw -B test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: Finance_tracker_Backend/Finance_Tracker/target/surefire-reports/
          if-no-files-found: ignore

  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Finance_tracker_Frontend/Finance_Tracker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # The runner image ships an Android SDK; install the same packages post-create.sh does
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools" > /dev/null
      # The google-services plugin needs this gitignored file. The secret is passed through env,
      # never interpolated into the script, and the file is never printed or uploaded.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The GOOGLE_SERVICES_JSON Actions secret is not set"
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Count unit tests
        if: always()
        run: |
          count="$(cat app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | grep -o '<testcase ' | wc -l || true)"
          echo "android tests: $count" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: Finance_tracker_Frontend/Finance_Tracker/app/build/reports/tests/
          if-no-files-found: ignore
