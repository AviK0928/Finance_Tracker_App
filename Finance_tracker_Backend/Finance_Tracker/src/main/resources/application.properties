spring.application.name=Finance_Tracker

# Database (values come from environment variables; see .env.example at the repo root)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Finance_Tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway migrations (db/migration); Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=36000000
# 1. "secret" is used to sign and validate the jwt token, ensuring only this server can generate valid tokens,
# we need to keep this secure and DO NOT HARDCODE it in production - store it as an environment variable instead
# 2. "expiration" controls how long this token remains valid (in milliseconds), adjustable for app's needs
# (shorter for higher security)

logging.level.root=INFO
logging.level.com.Finance_Tracker=DEBUG

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

mail.from.name=Quantro
mail.from.address=no-reply@quantro.com
# Budget expiry notification jobs (Spring cron: second minute hour day-of-month month day-of-week).
# Override on the command line for testing, e.g. --budget.notifications.expired-cron="*/10 * * * * *"
budget.notifications.expired-cron=0 0 9 * * *
budget.notifications.nearing-expiry-cron=0 15 9 * * *
